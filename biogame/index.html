function evText(id){let t=G.verification.tests.filter(x=>x.colonyId===id);return t.length?t.map(x=>x.summary).join('；'):'尚无检测'}const TEST_INFO={pcr:{name:'菌落 PCR',question:'这个菌落有没有目标插入片段？',can:'确认目标片段是否存在，并比较条带长度是否大致正确。',cannot:'不能确认全部序列，也通常不能单独排除点突变。',read:'预期长度条带＝值得继续；无条带＝多为空载体；异常长度＝可能缺片或重排。',cost:160},digest:{name:'诊断性酶切',question:'质粒整体结构和方向是否符合预期？',can:'通过切开后的片段数量和长度，判断结构、大小及部分方向信息。',cannot:'不能读取每个碱基；长度相近的微小突变通常看不出来。',read:'条带数和长度都匹配＝结构可信；少一条、多一条或位置偏移＝结构异常。',cost:240},sanger:{name:'Sanger 测序',question:'连接处和目标序列的碱基是否正确？',can:'确认读段范围内的碱基、连接边界、方向和点突变。',cannot:'单次读段未必覆盖整个大质粒，也不能替代所有结构检查。',read:'序列与设计一致＝最终确认；峰图异常或碱基不同＝突变或混合克隆。',cost:480}};function verifyPanel(){let v=G.verification,c=v.colonies.find(x=>x.id===v.selected),chosen=G.verifyChoice||'pcr',info=TEST_INFO[chosen],last=c?[...v.tests].reverse().find(t=>t.colonyId===c.id):null;return`<div class="eyebrow">VERIFY / SCREEN</div><h2>逐步确认一个菌落</h2><div class="note"><b>检测顺序</b><br>1 选择菌落　→　2 选择要回答的问题　→　3 执行检测　→　4 阅读结果，再决定是否继续。</div><p><b>第 1 步：选择菌落</b><br>每项结果只属于被选中的菌落，不会自动确认其他菌落。</p><div class="colonies">${v.colonies.map(x=>`<button class="colony ${x.id===v.selected?'selected':''}" data-colony="${x.id}"><b>${x.label}</b><span class="evidence">${evText(x.id)}</span></button>`).join('')}</div><p><b>第 2 步：你现在想确认什么？</b></p><div class="test-guide">${Object.entries(TEST_INFO).map(([id,x])=>`<button class="test-card ${chosen===id?'selected':''}" data-choose-test="${id}"><b>${x.name} · ${cash(x.cost)}</b><span>${x.question}</span></button>`).join('')}</div><div class="test-explain"><div><b>能确认</b>${info.can}</div><div class="cannot"><b>不能确认</b>${info.cannot}</div></div><div class="note"><b>结果怎么读</b><br>${info.read}</div><div class="actions"><button class="primary" data-test="${chosen}" ${c?'':'disabled'}>对${c?c.label:'所选菌落'}执行${info.name} · ${cash(info.cost)}</button></div>${last?`<div class="result-box"><strong>最近结果：${esc(last.summary)}</strong><small>${last.interpretation||'把结果与上面的判读规则比较，再决定是否追加检测。'}</small></div>`:'<div class="result-box"><strong>尚无结果</strong><small>先选择菌落，再执行一种检测。</small></div>'}`};function deliveryFit(){let o=order(),p=G.construct.product,c=G.verification.colonies.find(x=>x.id===G.verification.selected),ts=c?G.verification.tests.filter(t=>t.colonyId===c.id):[],targets=[o.target,o.secondTarget].filter(Boolean).every(id=>p?.segments.some(s=>s.partId===id&&s.orientation===1)),marker=p?.marker===o.marker,evidence=o.evidence.every(req=>ts.some(t=>t.type===req&&t.positive)),promoters=p?.segments.filter(s=>s.role==='promoter').length||0,terms=p?.segments.filter(s=>s.role==='term').length||0,cassettes=promoters>=o.cassetteCount&&terms>=o.cassetteCount,regulated=!o.regulated||(p?.segments.some(s=>['pt7','plac'].includes(s.partId))&&p?.segments.some(s=>['operator','riboswitch'].includes(s.partId))),spacer=o.cassetteCount<2||p?.segments.some(s=>s.role==='spacer'),tier4=tier4Fit(o,p?.segments||[],p?.vectorId);return{o,p,c,target:targets,marker,evidence,cassettes,regulated,spacer,tier4,ready:!!c&&targets&&marker&&evidence&&cassettes&&regulated&&spacer&&tier4.ready}}function deliverPanel(){let f=deliveryFit();return`<div class="eyebrow">DELIVERY / HANDOFF</div><h2>提交 Tier ${f.o.tier} · ${TIERS[f.o.tier].name}</h2><p>${TIERS[f.o.tier].focus}。本档需要 ${f.o.evidence.map(x=>TEST_INFO[x].name).join(' + ')}。</p><div class="checks"><div class="check ${f.target?'good':'bad'}">${f.target?'✓':'×'} 目标 CDS 与方向</div><div class="check ${f.cassettes?'good':'bad'}">${f.cassettes?'✓':'×'} ${f.o.cassetteCount} 个完整表达盒</div><div class="check ${f.regulated?'good':'bad'}">${f.regulated?'✓':'×'} 调控结构要求</div><div class="check ${f.spacer?'good':'bad'}">${f.spacer?'✓':'×'} 表达盒间隔要求</div><div class="check ${f.marker?'good':'bad'}">${f.marker?'✓':'×'} 骨架标记 ${f.o.marker}</div><div class="check ${f.evidence?'good':'bad'}">${f.evidence?'✓':'×'} ${f.o.evidence.length} 项验证证据</div>${f.tier4.checks.map(x=>`<div class="check ${x.ok?'good':'bad'}">${x.ok?'✓':'×'} ${x.label}</div>`).join('')}</div><div class="actions"><button class="primary" data-action="deliver" ${f.ready?'':'disabled'}>交付并获得 ${cash(f.o.reward)}</button><button data-phase="verify">返回验证</button></div>`}
function render(){ensureOrders();let o=order(),p=G.construct.product;$('#money').textContent=cash(G.money);$('#projects').textContent=G.projects;$('#revision').textContent=`R${G.construct.revision}`;$('#orderTitle').textContent=o.title;$('#orderBrief').textContent=`Tier ${o.tier} · ${TIERS[o.tier].name} · ${o.client} · ${o.marker} · ${o.evidence.map(x=>TEST_INFO[x].name).join(' + ')} · ${cash(o.reward)} + 奖金 ${cash(o.bonus)}`;$$('[data-phase]').forEach(b=>{b.classList.toggle('active',b.dataset.phase===G.phase);b.disabled=b.dataset.phase!=='construct'&&!p});let titles=G.phase==='construct'?['MOLECULE / 分子图',p?'最终连接产物':G.construct.digest?'开放载体与插入片段':'载体限制图谱']:G.phase==='verify'?['VERIFY / 菌落验证','选择菌落并建立证据']:['DELIVERY / 交付','最终质粒与订单符合度'];$('#viewEyebrow').textContent=titles[0];$('#viewTitle').textContent=titles[1];renderMolecule();let a=analyze();$('#checks').innerHTML=G.phase==='construct'?[...a.errors.map(x=>['bad','× '+x]),...a.warnings.map(x=>['warn','△ '+x]),...(a.ready?[['good','✓ 所有末端兼容且表达盒完整，可以连接。']]:[])].map(x=>`<div class="check ${x[0]}">${esc(x[1])}</div>`).join(''):p?`<div class="check good">✓ 当前证据绑定构建 ${p.id} · ${p.total} bp</div>`:'';$('#context').innerHTML=G.phase==='construct'?constructPanel():G.phase==='verify'?verifyPanel():deliverPanel();let logEl=$('#log');if(logEl)logEl.innerHTML=(G.legacyWorks.length?`<p>旧版作品：${G.legacyWorks.map(w=>`${esc(w.name)} ${w.len} bp`).join('；')}（仅查看）</p>`:'')+(G.logs.length?G.logs.map(x=>`<p>${esc(x)}</p>`).join(''):'<p>尚无实验记录。</p>');save()}
function test(type){let v=G.verification,c=v.colonies.find(x=>x.id===v.selected);if(!c)return toast('先选择菌落');let cost=TEST_INFO[type].cost;if(G.money<cost)return toast('资金不足');G.money-=cost;let pos=c.kind==='correct',label=TEST_INFO[type].name,summary=pos?`${label}：符合预期`:`${label}：${c.kind==='empty'?'无插入':'结构异常'}`,interpretation=pos?(type==='pcr'?'出现预期长度条带：说明目标片段存在，可以继续检查结构或序列。':type==='digest'?'条带数量和长度符合设计：质粒整体结构可信。':'连接边界和读段碱基与设计一致：该范围内未发现突变。'):(type==='pcr'?(c.kind==='empty'?'没有目标条带：这个菌落很可能是空载体。':'条带长度异常：可能缺片或重排。'):type==='digest'?'条带模式与设计不符：不建议交付这个菌落。':'序列与设计不一致：存在突变、错误连接或混合克隆。');if(type==='digest'&&pos){let p=G.construct.product;summary+=`（预计约 ${Math.round(p.total*.66)} / ${Math.round(p.total*.34)} bp）`}v.tests.push({id:'t'+Date.now(),constructId:v.constructId,colonyId:c.id,type,positive:pos,summary,interpretation});log(`${c.label} ${summary}`);render();toast('检测完成')}function doDeliver(){let f=deliveryFit();if(!f.ready)return toast('证据不满足订单');G.money+=f.o.reward;G.projects++;G.works.push({id:f.p.id,name:f.o.title,tier:f.o.tier,product:copy(f.p)});G.orders=G.orders.filter(x=>x.id!==f.o.id);G.selectedOrder=null;let unlocked=applyUnlocks();G.construct=newC();G.verification={constructId:null,colonies:[],selected:null,tests:[]};G.phase='construct';render();toast(unlocked?`交付完成，解锁 Tier ${unlocked} · ${TIERS[unlocked].name}`:'交付完成')}
function modal(html){$('#modalBody').innerHTML=html;$('#modal').classList.remove('hidden')}function market(){let o=order();modal(`<div class="eyebrow">ORDER MARKET / 委托市场</div><h2>当前最高 Tier ${G.progression.highestTier} · ${TIERS[G.progression.highestTier].name}</h2><p>市场同时保留当前档和较轻松订单。难度来自结构与证据要求，不是隐藏成功率。</p><div class="market-list">${G.orders.map(x=>{let t=TIERS[x.tier],blueprint=x.cassetteCount===2?'[P]—[RBS]—[CDS 1]—[T]　║　[P]—[RBS]—[CDS 2]—[T]':'[P]—[RBS]—[CDS]—[T]',targets=[x.target,x.secondTarget].filter(Boolean).map(id=>pa(id).name).join(' + ');return`<button class="market-order ${x.id===o.id?'selected':''}" data-order="${x.id}" style="border-left:5px solid ${t.color}"><span><b>Tier ${x.tier} · ${t.name}　${x.title}</b><small>${x.client} · ${x.story}</small><small class="mono">${blueprint}</small><small>目标：${targets} · ${x.marker} · 证据：${x.evidence.map(id=>TEST_INFO[id].name).join(' + ')}</small><small>预计投入 ${cash(x.estimate)} · 奖金上限 ${cash(x.bonus)} · ✓ 已生成可用路线</small></span><b>${cash(x.reward)}</b></button>`}).join('')}</div><div class="actions"><button data-action="refresh">刷新市场</button></div>`)}function cheatPanel(){modal(`<div class="eyebrow">DEV / 作弊指令</div><h2>开发快捷面板</h2><p>修改会立即写入当前存档。提升项目数会同步解锁对应 Tier 和内容。</p><div class="cheat-grid"><div class="field"><label>资金</label><input id="cheatMoney" type="number" min="0" step="100" value="${G.money}" style="width:100%;padding:9px;border:1px solid #b8c8c5"></div><button data-cheat="money">应用</button><div class="field"><label>完成项目数</label><input id="cheatProjects" type="number" min="0" step="1" value="${G.projects}" style="width:100%;padding:9px;border:1px solid #b8c8c5"></div><button data-cheat="projects">应用</button></div><div class="cheat-presets"><button data-cheat="rich">资金 +¥100,000</button><button data-cheat="tier2">解锁 Tier 2</button><button data-cheat="tier3">解锁 Tier 3</button><button data-cheat="tier4">解锁全部</button><button data-cheat="refresh">重刷市场</button><button class="danger" data-cheat="reset-build">重置当前构建</button><button class="danger" data-cheat="reset-all">重置所有进度</button></div><div class="note" style="margin-top:12px"><b>当前状态</b><br>${cash(G.money)} · ${G.projects} 项目 · Tier ${G.progression.highestTier} · 已解锁 ${G.unlocked.length} 项内容</div>`)}function applyCheat(cmd){if(cmd==='reset-all'){if(!confirm('确定重置所有进度吗？\n\n资金、项目、解锁、订单、构建和验证记录都会清空，无法撤销。'))return;localStorage.removeItem(SAVE);localStorage.removeItem(OLD);localStorage.removeItem(OLD_V1);G=fresh();ensureOrders();save();$('#modal').classList.add('hidden');render();toast('所有进度已重置');return}if(cmd==='money')G.money=Math.max(0,Number($('#cheatMoney')?.value)||0);if(cmd==='projects')G.projects=Math.max(0,Math.floor(Number($('#cheatProjects')?.value)||0));if(cmd==='rich')G.money+=100000;if(cmd==='tier2')G.projects=Math.max(G.projects,2);if(cmd==='tier3')G.projects=Math.max(G.projects,5);if(cmd==='tier4')G.projects=Math.max(G.projects,9);if(cmd==='reset-build'){G.construct=newC();G.verification={constructId:null,colonies:[],selected:null,tests:[]};G.phase='construct'}applyUnlocks();if(['projects','tier2','tier3','tier4','refresh'].includes(cmd)){G.orders=[];G.selectedOrder=null;ensureOrders()}save();render();cheatPanel();toast('作弊指令已应用')}function explain(){modal(`<div class="eyebrow">FIELD NOTE / 术语卡</div><h2>为什么必须先切质粒？</h2><p>完整环状质粒没有开放末端。限制酶在特定位点切开骨架；准备出的片段必须带兼容末端，才能依序接入。</p><p><b>限制位点：</b>刻线表示酶识别位置。片段内部出现相同位点时，该酶会把目标片段也切断。</p><p><b>连接处：</b>载体左端、片段之间、最后片段与载体右端都必须兼容。连接酶不会修正错误顺序。</p>`)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let a=b.dataset.action,ph=b.dataset.phase;if(ph){if(ph!=='construct'&&!G.construct.product)return toast('先连接闭环');G.phase=ph;return render()}if(a==='market')market();if(a==='cheat')cheatPanel();if(b.dataset.cheat)applyCheat(b.dataset.cheat);if(a==='close')$('#modal').classList.add('hidden');if(a==='explain')explain();if(a==='digest')digest();if(a==='prepare')prepare();if(a==='ligate')ligate();if(a==='recut'||a==='reopen')mutate('返回酶切步骤',c=>{c.digest=null;c.fragments=[];c.stage='chooseCuts'});if(a==='reset'&&confirm('重新开始当前构建？资金、订单和解锁保留。')){G.construct=newC();G.verification={constructId:null,colonies:[],selected:null,tests:[]};G.phase='construct';log('重新开始当前构建');render()}if(a==='deliver')doDeliver();if(a==='refresh'){G.orders=[];G.selectedOrder=null;ensureOrders();market()}if(a==='export'){let blob=new Blob([JSON.stringify(G,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='gene-forge-v2.json';l.click();URL.revokeObjectURL(u)}if(b.dataset.order){G.selectedOrder=b.dataset.order;$('#modal').classList.add('hidden');render()}if(b.dataset.edit)edit(b.dataset.id,b.dataset.edit);if(b.dataset.colony){G.verification.selected=b.dataset.colony;render()}if(b.dataset.chooseTest){G.verifyChoice=b.dataset.chooseTest;render()}if(b.dataset.test)test(b.dataset.test)});document.addEventListener('change',e=>{let i=e.target.dataset.input;if(i==='vector')mutate('更换载体',c=>{c.vectorId=e.target.value;c.digest=null;c.fragments=[];c.cuts=['eco','xho']});if(i==='cut0'){G.construct.cuts[0]=e.target.value;render()}if(i==='cut1'){G.construct.cuts[1]=e.target.value;render()}if(i==='part-preview'||i==='adapter-preview'){let pid=$('#partSelect')?.value,l=$('#leftAdapter')?.value,r=$('#rightAdapter')?.value;if(pid&&l&&r){let expected=G.construct.fragments.at(-1)?.right||G.construct.digest?.enzymes[0];if(i==='part-preview'){let left=$('#leftAdapter'),right=$('#rightAdapter');left.innerHTML=enzymeOptions(pid,l,expected);right.innerHTML=enzymeOptions(pid,r,null);if(!left.value)left.value=E.find(x=>!pa(pid).sites.some(s=>s.enzymeId===x.id))?.id||'sma';if(!right.value)right.value=E.find(x=>!pa(pid).sites.some(s=>s.enzymeId===x.id))?.id||'sma';l=left.value;r=right.value}let old=$('#sequenceInspector');if(old)old.outerHTML=sequenceInspector(pid,l,r)}}if(e.target.dataset.end)edit(e.target.dataset.id,e.target.dataset.end,e.target.value)});$('#modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.add('hidden')};ensureOrders();render();if(G.migrated){toast('旧存档经济与解锁已保留；构建流程已升级');G.migrated=false;save()}
</script></body></html>
